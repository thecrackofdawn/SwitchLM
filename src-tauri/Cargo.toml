[package]
name = "switchlm"
version = "0.1.1"
description = "SwitchLM — local LLM proxy for coding agents"
authors = ["SwitchLM"]
edition = "2021"

[lib]
# `_lib` suffix avoids bin/lib name clash on Windows (rust-lang/cargo#8519)
name = "switchlm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
keyring = "3"
eventsource-stream = "0.2"
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
chrono = "0.4"
sha2 = "0.10"
hmac = "0.12"
fastrand = "2"
rusqlite = { version = "0.31", features = ["bundled"] }

# 后端按目标 OS 叠加 feature：基础版本见上，每个 target 段补一个原生后端。
# Linux 用 linux-native-sync-persistent（dbus-secret-service，纯 Rust，仅需 libdbus-1）。
# macOS 行顺带启用，本期不验证（见 spec 非目标）。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
http-body-util = "0.1"
# `start_paused`/`tokio::time::pause` in the retry tests need `test-util`. Dev-only so the
# release build keeps the plain `full` feature (see transient-throttle-retry spec §7).
tokio = { version = "1", features = ["test-util"] }
