<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景深色发光渐变 -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#09090e" />
    </radialGradient>

    <!-- 主 S 型流线渐变 -->
    <linearGradient id="switchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- 节点发光渐变 -->
    <linearGradient id="nodeGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    
    <linearGradient id="nodeGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- 霓虹阴影滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 基础圆角矩形背景（iOS / macOS 桌面图标规格） -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2a2a3c" stroke-width="3" opacity="0.6" />

  <!-- 2. 背景微弱星芒/节点连接虚线 -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.12" stroke-dasharray="6,6">
    <line x1="140" y1="160" x2="372" y2="352" />
    <line x1="372" y1="160" x2="140" y2="352" />
  </g>

  <!-- 3. 核心 S 切换通道 (Switch Path) -->
  <path d="M 160 180 
           C 280 100, 360 220, 256 256 
           C 152 292, 232 412, 352 332" 
        fill="none" 
        stroke="url(#switchGradient)" 
        stroke-width="32" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- 4. 路由节点（象征智谱/火山/Fallback） -->
  <!-- 节点 A (智谱 / 主模型) -->
  <circle cx="160" cy="180" r="24" fill="url(#nodeGradient1)" filter="url(#glow)" />
  <circle cx="160" cy="180" r="10" fill="#ffffff" />

  <!-- 节点 B (火山 / Fallback) -->
  <circle cx="352" cy="332" r="24" fill="url(#nodeGradient2)" filter="url(#glow)" />
  <circle cx="352" cy="332" r="10" fill="#ffffff" />

  <!-- 节点 C (代理核心 Central Hub) -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="256" r="8" fill="#09090e" />

  <!-- 5. 动态箭头标志 (路由指示) -->
  <polygon points="328,140 352,160 320,172" fill="#00F2FE" opacity="0.9" />
  <polygon points="184,372 160,352 192,340" fill="#FF007A" opacity="0.9" />
</svg>
